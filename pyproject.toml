[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-firewall"
version = "0.2.0"
description = "Prompt-injection detection: local hard-markers + hardened Claude deep-scan, fail-closed"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "LeightonSec" }]
keywords = ["security", "llm", "prompt-injection", "jailbreak-detection", "ai-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Library dependencies ONLY (what `ai_firewall` imports): the Flask app's
# deps (flask, gunicorn, flask-limiter, werkzeug) stay in requirements.in —
# consumers installing this as a git dependency must not drag in a web stack.
# Pins mirror requirements.in; bump both together, then recompile the lockfile.
dependencies = [
    "anthropic==0.111.0",
    "python-dotenv==1.2.2",
]

[project.urls]
Homepage = "https://github.com/LeightonSec/ai-firewall"
Issues = "https://github.com/LeightonSec/ai-firewall/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_firewall*"]
